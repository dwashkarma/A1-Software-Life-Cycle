$kind: http-request
name: Create Attraction
order: 3000
url: '{{baseUrl}}/api/attractions'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sydney Opera House",
      "destination": "{{destinationId}}",
      "category": "Landmark",
      "location": "Bennelong Point, Sydney NSW 2000",
      "description": "Iconic performing arts centre on Sydney Harbour.",
      "image": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 or 400 or 401", function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 400, 401]);
      });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.test("Returns success true", function () {
          pm.expect(json.success).to.be.true;
        });
        pm.test("Returns attraction object", function () {
          pm.expect(json.attraction).to.have.property("_id");
        });
        pm.environment.set("attractionId", json.attraction._id);
      }
