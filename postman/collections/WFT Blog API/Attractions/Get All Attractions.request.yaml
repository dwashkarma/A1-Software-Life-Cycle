$kind: http-request
name: Get All Attractions
order: 1000
url: '{{baseUrl}}/api/attractions'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has success true", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has attractions array", function () {
        const json = pm.response.json();
        pm.expect(json.attractions).to.be.an("array");
      });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        if (json.attractions && json.attractions.length > 0) {
          pm.environment.set("attractionId", json.attractions[0]._id);
        }
      }
