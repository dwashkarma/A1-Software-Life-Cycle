$kind: http-request
name: Get Weather
order: 1000
url: '{{baseUrl}}/api/weather?destination=Sydney'
method: GET
queryParams:
  - key: destination
    value: Sydney
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 400 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 503]);
      });
      pm.test("Response has success field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("success");
      });
      if (pm.response.code === 200) {
        pm.test("Response has weather data", function () {
          const json = pm.response.json();
          pm.expect(json.weather).to.exist;
        });
      }
