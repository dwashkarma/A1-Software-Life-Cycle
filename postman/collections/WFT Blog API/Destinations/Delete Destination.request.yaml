$kind: http-request
name: Delete Destination
order: 3000
url: '{{baseUrl}}/api/destinations/{{destinationId}}'
method: DELETE
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 401 or 404 or 409", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 404, 409]);
      });
      pm.test("Response has success field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("success");
      });
