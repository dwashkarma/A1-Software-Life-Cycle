$kind: http-request
name: Update Itinerary
order: 4000
url: '{{baseUrl}}/api/itineraries/{{itineraryId}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sydney Extended Trip",
      "endDate": "2025-01-15"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 400 or 401 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 404]);
      });
      pm.test("Response has success field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("success");
      });
