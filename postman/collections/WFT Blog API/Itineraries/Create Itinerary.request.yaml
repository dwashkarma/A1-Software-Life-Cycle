$kind: http-request
name: Create Itinerary
order: 2000
url: '{{baseUrl}}/api/itineraries'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sydney Weekend Trip",
      "destination": "{{destinationId}}",
      "startDate": "2025-01-10",
      "endDate": "2025-01-12",
      "attractions": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 or 400 or 401", function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 400, 401]);
      });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.test("Returns success true", function () {
          pm.expect(json.success).to.be.true;
        });
        pm.test("Returns itinerary object", function () {
          pm.expect(json.itinerary).to.have.property("_id");
        });
        pm.environment.set("itineraryId", json.itinerary._id);
      }
