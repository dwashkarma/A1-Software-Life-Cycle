$kind: http-request
name: Login
order: 2000
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Login returns success true", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response contains user object", function () {
        const json = pm.response.json();
        pm.expect(json.user).to.have.property("id");
        pm.expect(json.user).to.have.property("email");
        pm.expect(json.user).to.have.property("role");
      });
